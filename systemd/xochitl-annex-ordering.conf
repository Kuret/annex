# Installed as /etc/systemd/system/xochitl.service.d/01-annex-wait-for-home.conf
#
# xochitl is started with LD_PRELOAD=/home/root/xovi/xovi.so by xovi's own
# drop-in. /home is an encrypted volume and mounts late, and the stock unit is
# ordered `After=data.mount` only — so on a cold boot xochitl usually wins the
# race, ld.so cannot open the library, and the device comes up as stock xochitl
# with no xovi and therefore no Annex.
#
# The only trace this leaves is one line in the journal, which is why it went
# unexplained for an evening on 2026-09-19:
#
#     ERROR: ld.so: object '/home/root/xovi/xovi.so' from LD_PRELOAD cannot be
#     preloaded (cannot open shared object file): ignored.
#
# Note "ignored": the preload failing is not an error to ld.so or to systemd.
# xochitl starts, the unit is active, nothing fails. It is the same class of
# silent failure as the extension being purged by a package manager.

[Unit]
# Ordering only. **Do not turn this into Requires=home.mount.**
#
# Requires= would make an unmountable /home take the UI down with it, and this
# device has already spent an evening unusable; recovery is a USB cable and an
# encrypted volume you cannot read from the host. A cold boot with no /home
# should still land on stock xochitl — a tablet that works without Annex — not
# on a wedged boot with no screen to tell anyone why.
#
# Wants=home.mount was also rejected: home.mount is pulled in by the system's
# own fstab generator anyway, so Wants= adds no ordering guarantee this line
# does not already give, and it dirties the dependency graph of a unit we do
# not own.
After=home.mount
